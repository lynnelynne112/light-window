<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self'"><link rel="stylesheet" href="ui.css"><title>轻窗 v3.0.0</title><body>
<div id="chromeRegion"><header class="top drag"><span class="title" title="拖动这里移动窗口">轻窗</span><label class="opacity" title="整个窗口的可见度：越低越透明"><span class="opacity-label">可见度</span><input id="visibility" data-pref="visibility" aria-label="窗口可见度" type="range" min="1" max="100"><output id="visibilityValue">25%</output></label><button class="mode" id="mode" title="切换鼠标移入显示与始终显示" aria-pressed="true">移入 · 开</button><button id="frame" title="隐藏工具栏与边框，只留网页">无框</button><button id="more" data-action="settings" title="更多设置与窗口操作" aria-label="更多设置与窗口操作" aria-expanded="false" aria-controls="extras">···</button><span class="window-actions"><button class="window-hide" data-action="hide" title="持续隐藏，Ctrl+Alt+Q 或托盘图标恢复" aria-label="持续隐藏">隐</button><button class="window-minimize" data-action="minimize" title="最小化" aria-label="最小化">—</button><button class="exit" data-action="quit" title="退出" aria-label="退出">×</button></span></header>
<nav class="nav"><button data-action="back" aria-label="返回上一页">←</button><button data-action="reload" aria-label="刷新">↻</button><button class="site-switch" id="site-switch" data-action="sites" title="添加、选择或管理网站">网站 ▾</button><button data-action="fit">适应</button><input id="address" aria-label="网页地址，按回车打开" spellcheck="false"><button class="return compact" id="return" data-action="return">返回原页</button></nav>
<section id="extras" class="extras" aria-label="更多设置" hidden>
<div class="more-visibility"><label for="menu-visibility">可见度 <output class="opacity-value"></output></label><input id="menu-visibility" data-pref="visibility" type="range" min="1" max="100" aria-label="窗口可见度"></div>
<div class="extra-row"><label class="zoom-control">缩放 <input id="zoom" data-pref="zoom" type="range" min="25" max="150" aria-label="网页缩放"><output id="zoomValue">70%</output></label><label class="check"><input id="topmost" data-pref="topmost" type="checkbox">置顶</label><select id="size" aria-label="窗口大小"><option value="">大小</option><option value="440,600">紧凑</option><option value="860,720">标准</option><option value="1120,820">宽屏</option></select><button data-action="close-settings" aria-label="收起更多设置">收起</button></div>
<div class="extra-row timing"><label>移出延迟 <span><input id="delay" data-pref="delay" type="number" min="0" max="2000" step="20" aria-label="移出后延迟毫秒"> ms</span></label><label>淡入淡出 <span><input id="fade" data-pref="fade" type="number" min="80" max="600" step="20" aria-label="淡入淡出毫秒"> ms</span></label></div>
<div class="menu-actions"><button class="more-sites" data-action="sites">网站</button><button class="more-hover" id="menu-mode">移入显示</button><button class="more-frame" id="menu-frame">隐藏边框</button><button class="more-window" data-action="hide">持续隐藏</button><button class="more-window" data-action="minimize">最小化</button><button class="more-exit" data-action="quit">退出</button></div>
<div class="menu-actions more-nav"><button data-action="back">返回</button><button data-action="reload">刷新</button><button data-action="home">题库</button><button data-action="fit">适应</button><button id="menu-return" data-action="return" hidden>返回原页</button></div>
</section>
<section id="sitesPanel" class="sites-panel" aria-label="网站管理" hidden>
<div class="sites-heading"><strong>我的网站</strong><button id="bookmark-current" type="button">收藏当前页</button><button data-action="close-sites" type="button">完成</button></div>
<div class="sites-scroll"><form id="site-form"><label>名称 <input id="site-name" maxlength="40" placeholder="例如：粉笔题库" autocomplete="off"></label><label>网址 <input id="site-url" maxlength="4096" placeholder="https://example.com" inputmode="url" autocomplete="off" required></label><div class="site-form-actions"><button id="site-save" class="primary" type="submit">添加并打开</button><button id="site-cancel" type="button" hidden>取消编辑</button></div></form><p id="site-notice" class="site-notice" role="status" aria-live="polite">点击名称切换网站，登录资料只保存在本机。</p><div id="site-list" class="site-list"></div></div>
</section></div>
<footer class="footer"><span id="status">正在准备…</span></footer><script src="chrome-ui.js"></script><script src="websites-ui.js"></script></body></html>
